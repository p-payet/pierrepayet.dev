packages:
  - .
strictDepBuilds: true
minimumReleaseAge: 10080 # 7 days
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - chokidar@4.0.3
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
overrides:
  '@types/react': '19.2.7'
  '@types/react-dom': '19.2.3'
  'foreground-child@3.1.1>cross-spawn@7.0.3': '7.0.5'
  'braces@3.0.2': '3.0.3'
  'sucrase@3.35.0>glob@10.3.10': '10.5.0'
  'micromatch@4.0.5': '4.0.8'
  'gray-matter>js-yaml': '^3.15.2'
  'postcss@8.4.31': '8.5.32'
  'minimatch@3.1.2>brace-expansion@1.1.11': '2.0.2'
  'minimatch@9.0.4>brace-expansion@2.0.1': '2.0.2'
  'eslint-import-resolver-typescript': '4.4.4'
  '@tailwindcss/typography>postcss-selector-parser': '^6.1.5'
  'minimatch@^10': '^11.0.5'
